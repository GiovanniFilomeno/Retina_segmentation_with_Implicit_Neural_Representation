schema_version: 1

experiment:
  name: fives_binary_inr
  status: illustrative_unvalidated_configuration
  task: binary
  seed: 42
  note: >-
    Safe, illustrative values for inspecting the pipeline. This configuration was not
    used to produce a retained checkpoint or independently reproduced benchmark.

data:
  dataset: FIVES
  images_dir: data/FIVES/train/Original
  masks_dir: data/FIVES/train/Ground truth
  image_size: [2048, 2048]
  patch_size: [256, 256]
  mask_values: [0, 255]
  augmentation: false

model:
  task: binary
  num_classes: null
  hidden_dim: 256
  num_layers: 4
  num_freqs: 5
  omega_0: 30.0
  dropout: 0.0
  activation: sine

loss:
  name: binary_focal_dice
  alpha: 0.75
  gamma: 2.0
  smooth: 1.0e-5

optimization:
  optimizer: adam
  learning_rate: 1.0e-3
  epochs: 10
  batch_size: 1
  scheduler: reduce_on_plateau

evaluation:
  threshold: 0.5
  metrics: [dice, iou, sensitivity, specificity, accuracy]
  report_per_image: true
