schema_version: 1

experiment:
  name: ravir_multiclass_inr
  status: illustrative_unvalidated_configuration
  task: multiclass
  seed: 42
  note: >-
    Safe, illustrative values for inspecting the pipeline. This configuration was not
    used to produce a retained checkpoint or independently reproduced benchmark.

data:
  dataset: RAVIR
  images_dir: data/RAVIR/train/training_images
  masks_dir: data/RAVIR/train/training_masks
  image_size: [256, 256]
  patch_size: [128, 128]
  mask_values: [0, 128, 255]
  augmentation: false

model:
  task: multiclass
  num_classes: 3
  hidden_dim: 256
  num_layers: 4
  num_freqs: 5
  omega_0: 30.0
  dropout: 0.0
  activation: sine

loss:
  name: multiclass_focal_dice
  alpha: 0.8
  gamma: 0.5
  smooth: 1.0e-5

optimization:
  optimizer: adam
  learning_rate: 1.0e-3
  epochs: 10
  batch_size: 1
  scheduler: reduce_on_plateau

evaluation:
  metrics: [macro_dice, macro_iou, per_class_dice, per_class_iou, accuracy]
  report_per_image: true
