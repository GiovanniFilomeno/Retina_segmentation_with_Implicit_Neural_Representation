<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Pointwise implicit neural representation baseline</title>
  <desc id="desc">Normalized coordinates and grayscale intensity pass through Fourier feature encoding and a SIREN multilayer perceptron to produce raw segmentation logits.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .label { font: 600 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .detail { font: 400 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .caption { font: 600 15px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #4338ca; letter-spacing: 0.3px; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="24" fill="url(#background)" stroke="#cbd5e1"/>
  <text x="600" y="42" text-anchor="middle" class="caption">POINTWISE RESEARCH BASELINE</text>

  <g filter="url(#shadow)">
    <rect x="55" y="96" width="235" height="160" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="348" y="96" width="235" height="160" rx="18" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
    <rect x="641" y="96" width="235" height="160" rx="18" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
    <rect x="934" y="96" width="210" height="160" rx="18" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  </g>

  <text x="173" y="137" text-anchor="middle" class="label">Per-pixel input</text>
  <text x="173" y="174" text-anchor="middle" class="detail">normalized (x, y)</text>
  <text x="173" y="198" text-anchor="middle" class="detail">grayscale intensity I</text>
  <text x="173" y="228" text-anchor="middle" class="detail">shape: (N, 3)</text>

  <text x="466" y="137" text-anchor="middle" class="label">Fourier features</text>
  <text x="466" y="174" text-anchor="middle" class="detail">sin(π·2ᵏx), cos(π·2ᵏx)</text>
  <text x="466" y="198" text-anchor="middle" class="detail">sin(π·2ᵏy), cos(π·2ᵏy)</text>
  <text x="466" y="228" text-anchor="middle" class="detail">concatenate intensity</text>

  <text x="759" y="137" text-anchor="middle" class="label">SIREN MLP</text>
  <text x="759" y="174" text-anchor="middle" class="detail">linear projections</text>
  <text x="759" y="198" text-anchor="middle" class="detail">sinusoidal activations</text>
  <text x="759" y="228" text-anchor="middle" class="detail">pointwise prediction</text>

  <text x="1039" y="137" text-anchor="middle" class="label">Raw logits</text>
  <text x="1039" y="174" text-anchor="middle" class="detail">binary: (N, 1)</text>
  <text x="1039" y="198" text-anchor="middle" class="detail">multiclass: (N, C)</text>
  <text x="1039" y="228" text-anchor="middle" class="detail">activation at evaluation</text>

  <path class="arrow" d="M290 176 H338"/>
  <path class="arrow" d="M583 176 H631"/>
  <path class="arrow" d="M876 176 H924"/>

  <text x="600" y="313" text-anchor="middle" class="detail">No convolutional encoder or neighbourhood context · arbitrary query grids are possible, but cross-resolution generalization is not claimed</text>
</svg>
